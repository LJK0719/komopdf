name: Public source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Website release version (vMAJOR.MINOR.PATCH-site.DATE.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 scripts/prepare-fonts.py
      - run: node scripts/prepare-web-runtime.mjs
      - run: pnpm --filter @pdf-editor/web build
      - run: pnpm --filter @pdf-editor/gateway build
      - run: python3 scripts/collect-core-notices.py --check

  production-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/prepare-fonts.py
      - run: node infra/prepare-release.mjs "$RELEASE_VERSION"
      - name: Verify extracted Linux production bundle without an upstream request
        run: |
          mkdir tmp/extracted-release
          tar -xzf "tmp/release-$RELEASE_VERSION.tar.gz" -C tmp/extracted-release
          node infra/smoke-release.mjs tmp/extracted-release
      - name: Upload verified website bundle for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komopdf-site-${{ inputs.version }}
          path: tmp/release-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
