name: Public source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 scripts/prepare-fonts.py
      - run: node scripts/prepare-web-runtime.mjs
      - run: pnpm --filter @pdf-editor/web build
      - run: pnpm --filter @pdf-editor/gateway build
      - run: python3 scripts/collect-core-notices.py --check

  production-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/prepare-fonts.py
      - run: node infra/prepare-release.mjs v0.1.0-ci.${{ github.run_number }}
      - name: Verify extracted Linux production bundle without an upstream request
        run: |
          mkdir tmp/extracted-release
          tar -xzf tmp/release-v0.1.0-ci.${{ github.run_number }}.tar.gz -C tmp/extracted-release
          node infra/smoke-release.mjs tmp/extracted-release
